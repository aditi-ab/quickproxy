name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source, history, and Aditify
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Scan Git history for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --no-banner /repo
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: corepack enable
      - run: yarn --cwd Packages/Aditify install --frozen-lockfile && yarn install --frozen-lockfile
      - run: yarn build:ui && yarn test && yarn type-check && yarn build
      - run: dotnet test QuickProxy.slnx -c Release

  container:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/quickproxy
          tags: |
            type=raw,value=0.9.${{ github.run_number }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and optionally publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            APP_VERSION=0.9.${{ github.run_number }}
            APP_ASSEMBLY_VERSION=0.9.${{ github.run_number }}.0
          cache-from: type=gha,scope=quickproxy
          cache-to: type=gha,mode=max,scope=quickproxy

  publish-sdk:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Pack SDK
        run: dotnet pack src/QuickProxy.Sdk/QuickProxy.Sdk.csproj -c Release -o .artifacts/nuget -p:Version=0.9.${{ github.run_number }}
      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish SDK
        run: dotnet nuget push .artifacts/nuget/QuickProxy.Sdk.*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
