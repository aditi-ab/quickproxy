<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>504 Gateway Timeout</title>
    <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #314e89, #0a1228 64%);
      color: #edf3ff;
      font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
    }
    main {
      width: min(640px, calc(100vw - 32px));
      padding: 32px;
      border-radius: 20px;
      background: rgba(8, 13, 27, 0.84);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }
    .code {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(110, 168, 254, 0.18);
      color: #9ec5fe;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    h1 { margin: 16px 0 10px; font-size: clamp(2rem, 5vw, 3rem); }
    p { margin: 0; color: #bcc8db; }
  </style>
</head>
<body>
<main>
    <div class="code">504</div>
    <h1>Gateway Timeout</h1>
    <p>QuickProxy waited for the upstream target, but the upstream did not respond in time.</p>
</main>
</body>
</html>
