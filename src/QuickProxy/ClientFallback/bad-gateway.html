<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>502 Bad Gateway</title>
    <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #243b53, #0b1020 62%);
      color: #e6edf7;
      font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
    }
    main {
      width: min(640px, calc(100vw - 32px));
      padding: 32px;
      border-radius: 20px;
      background: rgba(9, 14, 28, 0.82);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }
    .code {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 184, 0, 0.16);
      color: #ffd166;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    h1 { margin: 16px 0 10px; font-size: clamp(2rem, 5vw, 3rem); }
    p { margin: 0; color: #afbdd1; }
  </style>
</head>
<body>
<main>
    <div class="code">502</div>
    <h1>Bad Gateway</h1>
    <p>QuickProxy reached the upstream target, but the upstream response was invalid or unavailable.</p>
</main>
</body>
</html>
